# Frontend — CI/CD Pipeline
#
# Triggers:
#   - Push to dev/prod: build + push image, update image tag in helm/values.yaml
#
# Required secrets:
#   - CF_ORG_ID:              Cloudfleet organization ID
#   - CF_ACCESS_TOKEN:        Cloudfleet token ID
#   - CF_ACCESS_TOKEN_SECRET: Cloudfleet token secret
#   - CF_CR_REGION:           Cloudfleet container registry region
#   - AUTH_IAM_SUBPATH:       IAM subpath (e.g. /iam)
#   - HOST_NAME:              Domain name of host

name: Build and Deploy Frontend

on:
  push:
    branches: [dev, prod]

env:
  REGISTRY: ${{ secrets.CF_ORG_ID }}.${{ secrets.CF_CR_REGION }}.registry.cloudfleet.dev
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Cloudfleet Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CF_ACCESS_TOKEN }}
          password: ${{ secrets.CF_ACCESS_TOKEN_SECRET }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          build-args: |
            VITE_IAM_SUBPATH=${{ secrets.AUTH_IAM_SUBPATH }}
          cache-to: type=gha,scope=frontend,mode=max
          cache-from: type=gha,scope=frontend

  update-helm-values:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          # Install yq for YAML in-place editing
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag in helm/values.yaml
        run: |
          # Pin the deployed image to the exact commit SHA
          yq e '.frontend.image.tag = "${{ github.sha }}"' -i helm/values.yaml
          yq e '.frontend.image.repository = "${{ env.REGISTRY }}/frontend"' -i helm/values.yaml
          yq e '.gateway.hosts.domain = "${{ secrets.HOST_NAME }}"' -i helm/values.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push
