# Frontend — CI Pipeline
#
# Triggers:
#   - Push to dev/prod: build + push image, then update image tag in kubernetes-deployment
#
# Required secrets:
#   - CF_ORG_ID:              Cloudfleet organization ID
#   - CF_ACCESS_TOKEN:        Cloudfleet token ID
#   - CF_ACCESS_TOKEN_SECRET: Cloudfleet token secret
#   - CF_CR_REGION:           Cloudfleet container registry region
#   - AUTH_IAM_SUBPATH:       IAM subpath (e.g. /iam)
#   - DEPLOY_REPO_TOKEN:      GitHub PAT with write access to kubernetes-deployment repo

name: Build and Push Frontend

on:
  push:
    branches: [dev, prod]

env:
  REGISTRY: ${{ secrets.CF_ORG_ID }}.${{ secrets.CF_CR_REGION }}.registry.cloudfleet.dev
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Cloudfleet Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CF_ACCESS_TOKEN }}
          password: ${{ secrets.CF_ACCESS_TOKEN_SECRET }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          build-args: |
            VITE_IAM_SUBPATH=${{ secrets.AUTH_IAM_SUBPATH }}
          cache-to: type=gha,scope=frontend,mode=max
          cache-from: type=gha,scope=frontend

  update-deployment-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kubernetes-deployment
        uses: actions/checkout@v4
        with:
          repository: lezw-1/kubernetes-deployment
          ref: ${{ github.ref_name }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Install yq
        run: |
          # Install yq for YAML in-place editing
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag in helm/envs
        run: |
          # Pin the deployed image to the exact commit SHA
          ENV_FILE="helm/envs/${{ github.ref_name }}.yaml"
          yq e '.frontend.values.image.tag = "${{ github.sha }}"' -i "$ENV_FILE"
          yq e '.frontend.values.image.repository = "${{ env.REGISTRY }}/frontend"' -i "$ENV_FILE"

      - name: Commit and push updated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/envs/${{ github.ref_name }}.yaml
          git commit -m "chore: update frontend image tag to ${{ github.sha }}"
          git push
