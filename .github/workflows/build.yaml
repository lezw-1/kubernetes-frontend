# Frontend — CI Pipeline
#
# Triggers:
#   - Push to dev/prod: build + push image
#
# Required secrets:
#   - CF_ORG_ID:              Cloudfleet organization ID -> run 'cloudfleet organization describe'
#   - CF_ACCESS_TOKEN:        Cloudfleet token ID -> create token via UI and use 'Access Token'
#   - CF_ACCESS_TOKEN_SECRET: Cloudfleet token secret -> create token via UI and use 'Access Token Secret'
#   - CF_CR_REGION:           Cloudfleet container registry region -> get via UI 'https://console.cloudfleet.ai/registry'
#   - AUTH_IAM_SUBPATH:       IAM subpath (e.g. /iam)
#   - GITOPS_DISPATCH_TOKEN:  Fine-grained PAT scoped to lezw-1/kubernetes-gitops, Actions: Read and
#                             write -> dispatches that repo's image-tag-bump workflow (via workflow_dispatch,
#                             with ref set to the target env branch) on staging/prod pushes

name: Build and Push Frontend

on:
  push:
    branches: [dev, staging, prod]

env:
  REGISTRY: ${{ secrets.CF_ORG_ID }}.${{ secrets.CF_CR_REGION }}.registry.cloudfleet.dev
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Cloudfleet Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CF_ACCESS_TOKEN }}
          password: ${{ secrets.CF_ACCESS_TOKEN_SECRET }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          build-args: |
            VITE_IAM_SUBPATH=${{ secrets.AUTH_IAM_SUBPATH }}
          cache-to: type=gha,scope=frontend,mode=max
          cache-from: type=gha,scope=frontend

  notify-gitops:
    # Staging/prod only — dev deploys a locally built image and never
    # consumes anything pushed to the registry (see kubernetes-gitops
    # argocd/clusters/dev/values/frontend.yaml).
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref_name == 'staging' || github.ref_name == 'prod'
    steps:
      - name: Dispatch image-tag-bump workflow in kubernetes-gitops
        # Runs kubernetes-gitops's image-tag-bump workflow via workflow_dispatch
        # (not repository_dispatch — that always resolves against the repo's
        # default branch, which would silently run the wrong env's copy of the
        # workflow). ref:$env makes GitHub load and run the copy of the workflow
        # that lives on the target env branch. It bumps image.tag in the
        # matching argocd/clusters/<env>/values/frontend.enc.yaml via sops and
        # pushes — Argo CD's existing syncPolicy.automated then picks up the
        # change on its own.
        env:
          GITOPS_DISPATCH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          ENV_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $GITOPS_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lezw-1/kubernetes-gitops/actions/workflows/image-tag-bump.yaml/dispatches \
            -d "$(jq -n --arg env "$ENV_NAME" --arg sha "$SHA" \
                '{ref:$env, inputs:{app:"frontend", env:$env, sha:$sha}}')"
